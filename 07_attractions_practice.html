<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <title>06_attractions_template</title>
  </head>
  <body>
    <!-- 建立根容器 -->
    <div id="app" class="p-5 container">
      {{console.log('test:1',$emit)}}

      <div class="row h-100 ">
      <!-- 搜尋框、景點選單 -->
      <div class="col-md-3 h-100 d-flex flex-column">
        <!-- 搜尋框 -->
        <div class="form-floating mb-2">
          <input type="text" class="form-control" v-model="searchKeyword" id="search" placeholder="search" >
          <label for="search">search</label>
        </div>
        <!-- 景點選單 -->
        <div class="list-group option">
          <label class="list-group-item" v-for="data in searchFilter"  v-bind:key='data.id'>
            <input class="form-check-input me-1" v-model="tempAttraction" v-bind:value='data' type="radio" name="area">
            {{ data.Name }}
          </label>
        </div>
      </div>
      <!-- 瀏覽記錄、景點畫面 -->
      <div class="col-md-8 h-100 d-flex flex-column">
        <!-- 瀏覽記錄 -->
        <div class="form-floating">
          <select v-model="tempAttraction"  id="cacheArea" class="form-select w-50 mb-2" aria-label="select example">
            <option selected value="" disabled>瀏覽紀錄</option>
            <option v-for="record in browseRecordData"  v-bind:value="record" v-bind:key="record.Id">{{record.Name}}</option>
          </select>
          <label for="cacheArea">瀏覽紀錄</label>
        </div>
        <!-- 請選擇景點、 景點畫面 -->
        <div>
        <!-- 請選擇景點 -->
          <div v-if="!tempAttraction">
            <h2>請選擇景點選單</h2>
          </div>
        <!-- 景點畫面 -->
          <div class="card overflow-auto" v-else="tempAttraction">
              <!-- 圖片 -->
            <img v-bind:src="tempAttraction.Picture1" class="card-img-top" :alt="datastore.Name">
            <!-- 地圖 -->
            <iframe width="100%" height="300" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
            :src=`https://maps.google.com.tw/maps?f=q&hl=zh-TW&geocode=&q=${tempAttraction.Py},${tempAttraction.Px}(${tempAttraction.Name})&z=16&output=embed`></iframe>
            <!-- 名稱、介紹 -->
            <div class="card-body">
              <!-- 名稱 -->
              <h5 class="card-title">{{ tempAttraction.Name }}</h5>
              <!-- 介紹 -->
              <p>{{ tempAttraction.Description }}</p>
            </div>
          </div>
      </div>
        </div>

      </div>
    </div>


    <!-- 透過 CDN 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 建立根容器 -->
    <script>
      const apiUrl = 'https://raw.githubusercontent.com/hexschool/KCGTravel/master/datastore_search.json';

      // 傳入根元件選項物件，建立 Vue 應用程式實例 ( 物件 )。
      const app = Vue.createApp({
       data() {
          return {
            datastore: [],
            tempAttraction:'',
            searchKeyword: '',
            browseRecordData: [],
          };
        },
        methods:{
          async getProducts(){
            try {
            const res = await axios.get(apiUrl);
            console.log('取得全部景點資料成功');
            this.datastore = res.data.result.records;
            console.log(this.datastore);
            } catch (error) {
            console.log('取得全部景點資料失敗');
            console.dir(error);
            }
          },
          // storeTempAttractionHandler(attraction){
          //   this.tempAttraction = attraction;
          //   this.browseRecordData.push(attraction);
          // }
        },
        computed:{
          searchFilter(){
            return this.datastore.filter((data)=>{
            return data.Name.includes(this.searchKeyword)
            })
          }
     
        },
        watch:{
          tempAttraction(){
            if(this.browseRecordData.length < 10){
            this.browseRecordData.push(this.tempAttraction);
            } else {
                this.browseRecordData.shift();
            this.browseRecordData.push(this.tempAttraction);
            }
          }
        }
        ,
        mounted(){
          this.getProducts();
        }
      });

      // 將 Vue 應用程式掛載到指定的 HTML 中的 #app 元素(根容器)。
      app.mount("#app");
    </script>
    <style>
      #app {
        height: 600px;
      }

      .option {
        overflow-y: auto;
      }
      </style>
  </body>
</html>
