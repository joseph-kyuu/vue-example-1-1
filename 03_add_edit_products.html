<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>03_add_edit_products</title>
  </head>
  <body>
    <!-- 建立根容器 -->
    <div class="container py-3" id="app">
      <div class="mb-3 text-end">
        <button
          type="button"
          class="btn btn-warning"
          name="addBtn"
          v-on:click="showFormHandler($event, emptyProduct)"
        >
          新增
        </button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>標題</th>
            <th>圖片</th>
            <th>銷售狀態</th>
            <th>編輯</th>
          </tr>
        </thead>
        <tbody>
          <tr
            v-for="product in products"
            v-bind:key="product.id"
            v-bind:class="product.onStock && 'table-success'"
          >
            <td>{{product.name}}</td>
            <td>
              <img v-bind:src="product.imageUrl" alt="" />
            </td>
            <!-- 銷售狀態 -->
            <td>
              <input type="checkbox" v-model="product.onStock" />
            </td>
            <td>
              <button
                type="button"
                class="btn btn-primary"
                name="editBtn"
                v-on:click="showFormHandler($event, product)"
              >
                編輯
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <form v-if="isOpen">
        <div class="mb-3">
          <label for="productName" class="form-label">產品名稱</label>
          <input
            type="text"
            id="productName"
            class="form-control"
            v-model="temp.name"
          />
        </div>
        <div class="mb-3">
          <label for="productImage" class="form-label">產品圖片</label>
          <input
            type="text"
            id="productImage"
            class="form-control"
            v-model="temp.imageUrl"
          />
        </div>
        <div class="mb-3">
          <img v-bind:src="temp.imageUrl" class="img-fluid" alt="" />
        </div>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-info"
            v-on:click="confitmHandler"
          >
            確認
          </button>
          <button
            type="button"
            class="btn btn-danger"
            v-on:click="cancelHandler"
          >
            取消
          </button>
        </div>
      </form>
    </div>

    <!-- 透過 CDN 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 建立根容器 -->
    <script>
      // 商品資料
      const products = [
        {
          id: "1",
          imageUrl:
            "https://images.unsplash.com/photo-1516906571665-49af58989c4e?ixlib=rb-1.2.1&ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&auto=format&fit=crop&w=300&q=80",
          name: "MacBook Pro",
          onStock: false,
        },
        {
          id: "2",
          imageUrl:
            "https://images.unsplash.com/photo-1512499617640-c74ae3a79d37?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80",
          name: "iPhone",
          onStock: false,
        },
      ];

      // 傳入根元件選項物件，建立 Vue 應用程式實例 ( 物件 )。
      const app = Vue.createApp({
        // 資料與狀態
        data() {
          return {
            // 全部商品資料
            products,
            // 移除或顯示表單區塊狀態
            isOpen: false,
            // 空商品資料 點擊新增按鈕時，傳入 temp
            emptyProduct: {
              id: "",
              imageUrl: "",
              name: "",
              onStock: "",
            },
            // 暫存商品
            temp: this.emptyProduct,
            // 按鈕模式
            btnMode: "",
          };
        },
        // 方法
        methods: {
          // 移除或顯示表單區塊 handler
          showFormHandler(e, product) {
            this.isOpen = true;
            this.temp = { ...product };
            this.btnMode = e.target.name;
          },
          // 編輯按鈕 handler
          editProductHandler() {
            this.products.map((product, index) => {
              if (product.id === this.temp.id) {
                this.products[index] = this.temp;
              }

              this.isOpen = false;
            });
          },
          // 新增按鈕 handler
          addProductHandler() {
            const id = crypto.randomUUID();
            this.temp.id = id;
            this.temp.onStock = false;
            this.products.push(this.temp);
            this.isOpen = false;
            this.temp = this.emptyProduct;
          },
          // 確認按鈕 handler
          confitmHandler() {
            if (this.btnMode === "addBtn") {
              this.addProductHandler();
              this.temp = this.empty;
            } else {
              this.editProductHandler();
              this.temp = this.empty;
            }
          },
          cancelHandler() {
            this.isOpen = false;
          },
        },
      });

      // 將 Vue 應用程式掛載到指定的 HTML 中的 #app 元素(根容器)。
      app.mount("#app");
    </script>
  </body>
</html>
