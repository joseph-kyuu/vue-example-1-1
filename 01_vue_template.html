<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01_vue_template</title>
  </head>
  <body>
    <!-- 建立根容器 -->
    <div id="app">{{ message }}</div>

    <!-- 透過 CDN 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 建立根容器 -->
    <script>
      // 從 vue，解構出 createApp
      // const { createApp } = Vue;

      // 也可以先準備好元件，再放createApp()
      //   const App = {
      //     data() {
      //       return {
      //         message: "Hello Vue!",
      //       };
      //     },
      //     template: `
      //   <h1>{{ message }}</h1>
      // `,
      //   };

      // 把上方準備好的元件放入
      // const app = Vue.createApp(App);

      // 傳入根元件選項物件，建立 Vue 應用程式實例 ( 物件 )。
      const app = Vue.createApp({
        data() {
          return {
            message: "Vue 的 CDN 環境，已建置完成",
          };
        },
      });

      // 將 Vue 應用程式掛載到指定的 HTML 中的 #app 元素(根容器)。
      app.mount("#app");
    </script>
  </body>
</html>
